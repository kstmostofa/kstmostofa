<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Md Mostafijur Rahman — Full Stack Software Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.55" stop-color="#0b1a3a"/>
      <stop offset="1" stop-color="#0c2a4d"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#bae6fd"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow1"><stop offset="0" stop-color="#0ea5e9" stop-opacity="0.55"/><stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2"><stop offset="0" stop-color="#6366f1" stop-opacity="0.45"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#38bdf8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.2"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1200" height="360" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect width="1200" height="360" rx="20"/></clipPath>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; }
    .float1 { animation: float1 9s ease-in-out infinite; }
    .float2 { animation: float2 11s ease-in-out infinite; }
    @keyframes float1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(40px,25px); } }
    @keyframes float2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-45px,-20px); } }
    .fadeUp { opacity: 0; animation: fadeUp .9s ease-out forwards; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .6s; } .d4 { animation-delay: .85s; } .d5 { animation-delay: 1.1s; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .pulse { animation: pulse 2s ease-in-out infinite; transform-origin: 72px 64px; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .line { stroke-dasharray: 260; stroke-dashoffset: 260; animation: draw 1.4s ease-out .9s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <circle class="float1" cx="980" cy="70" r="260" fill="url(#glow1)"/>
    <circle class="float2" cx="760" cy="360" r="240" fill="url(#glow2)"/>
    <rect width="1200" height="360" fill="url(#grid)" mask="url(#gridMask)"/>

    <!-- status pill -->
    <g >
      <rect x="60" y="48" width="170" height="32" rx="16" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-opacity="0.45"/>
      <circle class="pulse" cx="80" cy="64" r="5" fill="#22c55e"/>
      <text x="94" y="69" class="sans" font-size="13" font-weight="600" letter-spacing="1.5" fill="#86efac">OPEN TO WORK</text>
    </g>

    <!-- name & title -->
    <text x="58" y="148" class="sans" font-size="54" font-weight="800" fill="url(#nameGrad)" letter-spacing="-1">Md Mostafijur Rahman</text>
    <text x="60" y="194" class="sans" font-size="26" font-weight="600" fill="#e2e8f0">Full Stack Software Engineer</text>
    <path d="M60 214 H320" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <text x="60" y="250" class="sans" font-size="17" fill="#94a3b8">Scalable web apps · Cloud telephony · SaaS · 7+ years shipping production systems</text>

    <!-- tech chips -->
    <g class="sans" font-size="14" font-weight="600">
      <g transform="translate(60 282)"><rect width="84" height="32" rx="8" fill="#f43f5e" fill-opacity="0.12" stroke="#f43f5e" stroke-opacity="0.4"/><text x="42" y="21" text-anchor="middle" fill="#fda4af">Laravel</text></g>
      <g transform="translate(154 282)"><rect width="62" height="32" rx="8" fill="#818cf8" fill-opacity="0.12" stroke="#818cf8" stroke-opacity="0.4"/><text x="31" y="21" text-anchor="middle" fill="#c7d2fe">PHP</text></g>
      <g transform="translate(226 282)"><rect width="76" height="32" rx="8" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.4"/><text x="38" y="21" text-anchor="middle" fill="#a5f3fc">React</text></g>
      <g transform="translate(312 282)"><rect width="84" height="32" rx="8" fill="#e2e8f0" fill-opacity="0.08" stroke="#e2e8f0" stroke-opacity="0.35"/><text x="42" y="21" text-anchor="middle" fill="#f1f5f9">Next.js</text></g>
      <g transform="translate(406 282)"><rect width="62" height="32" rx="8" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.4"/><text x="31" y="21" text-anchor="middle" fill="#fcd34d">AWS</text></g>
      <g transform="translate(478 282)"><rect width="106" height="32" rx="8" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-opacity="0.4"/><text x="53" y="21" text-anchor="middle" fill="#93c5fd">PostgreSQL</text></g>
      <g transform="translate(594 282)"><rect width="104" height="32" rx="8" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.4"/><text x="52" y="21" text-anchor="middle" fill="#6ee7b7">FreeSWITCH</text></g>
    </g>

    <!-- terminal card -->
    <g  transform="translate(790 70)">
      <rect width="350" height="220" rx="14" fill="#020617" fill-opacity="0.72" stroke="#38bdf8" stroke-opacity="0.25"/>
      <rect width="350" height="36" rx="14" fill="#0f172a"/>
      <rect y="22" width="350" height="14" fill="#0f172a"/>
      <circle cx="22" cy="18" r="6" fill="#ef4444"/><circle cx="42" cy="18" r="6" fill="#f59e0b"/><circle cx="62" cy="18" r="6" fill="#22c55e"/>
      <text x="175" y="23" text-anchor="middle" class="mono" font-size="12" fill="#64748b">~/mostofa.me</text>
      <g class="mono" font-size="14">
        <text x="20" y="66"><tspan fill="#38bdf8">$</tspan><tspan fill="#e2e8f0"> whoami</tspan></text>
        <text x="20" y="90" fill="#94a3b8">full-stack · backend · devops</text>
        <text x="20" y="122"><tspan fill="#38bdf8">$</tspan><tspan fill="#e2e8f0"> cat stack.json</tspan></text>
        <text x="20" y="146"><tspan fill="#c084fc">{ </tspan><tspan fill="#7dd3fc">"api"</tspan><tspan fill="#e2e8f0">: </tspan><tspan fill="#86efac">"Laravel"</tspan><tspan fill="#e2e8f0">,</tspan></text>
        <text x="36" y="168"><tspan fill="#7dd3fc">"ui"</tspan><tspan fill="#e2e8f0">: </tspan><tspan fill="#86efac">"Next.js"</tspan><tspan fill="#c084fc"> }</tspan></text>
        <text x="20" y="200"><tspan fill="#38bdf8">$</tspan><tspan class="cursor" fill="#e2e8f0"> ▋</tspan></text>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="20" fill="none" stroke="#38bdf8" stroke-opacity="0.18"/>
</svg>
